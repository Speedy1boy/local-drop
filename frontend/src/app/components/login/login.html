<div class="login-wrapper">
  <mat-card class="login-card">
    <mat-icon class="lock-icon" color="primary">lock</mat-icon>
    <h2>Local Drop</h2>
    <p>Введите PIN-код для доступа</p>
    
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>PIN-код</mat-label>
      <input matInput type="password" [(ngModel)]="pinCode" (keydown.enter)="login()">
    </mat-form-field>

    @if (authService.loginError()) {
      <p class="error-text">{{ authService.loginError() }}</p>
    }

    <button mat-flat-button color="primary" class="full-width login-btn" (click)="login()">
      Войти
    </button>
  </mat-card>
</div>
