<div class="fullscreen-container">
  <div class="top-bar">
    <h2 [title]="currentFile.originalName">{{ currentFile.originalName }}</h2>
    <div class="actions">
      
      @if (isImage) {
        <button mat-icon-button class="action-btn" (click)="rotate()" title="Повернуть на 90°">
          <mat-icon>rotate_right</mat-icon>
        </button>
      }

      <button mat-icon-button class="action-btn" (click)="onDownload()" title="Скачать">
        <mat-icon>download</mat-icon>
      </button>
      <button mat-icon-button class="action-btn" (click)="onDelete()" title="Удалить">
        <mat-icon color="warn">delete</mat-icon>
      </button>
      <button mat-icon-button class="action-btn close-btn" mat-dialog-close title="Закрыть">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </div>

  <div class="media-content">
    
    @if (hasPrev) {
      <button mat-icon-button class="nav-btn prev-btn" (click)="prev()">
        <mat-icon>chevron_left</mat-icon>
      </button>
    }

    @if (isImage) {
      <img 
        [src]="url" 
        alt="preview" 
        [class.sideways]="isRotatedSideways" 
        [style.transform]="'rotate(' + rotation + 'deg)'"
      >
    } @else if (isVideo) {
      <video controls [src]="url" autoplay></video>
    } @else if (isAudio) {
      <audio controls [src]="url" autoplay></audio>
    } @else {
      <div class="doc-placeholder">
        <mat-icon>insert_drive_file</mat-icon>
        <p>Предпросмотр недоступен</p>
      </div>
    }

    @if (hasNext) {
      <button mat-icon-button class="nav-btn next-btn" (click)="next()">
        <mat-icon>chevron_right</mat-icon>
      </button>
    }

  </div>
</div>
